[project]
name = "run-log"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ducquanbm2", email = "quanitk10@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
run-log = "run_log:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
exclude = ['^\.venv/', '^build/']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
pythonpath = ["src"]
